# =============================================================================
# Job загрузки весов GLM-5.2 (zai-org/GLM-5.2) из HuggingFace в S3-контейнер
# Selectel (s3ModelCopy; шаблон s3-model-copy чарта — альтернатива Job'у из
# addons/models/). Требует Secret selectel-s3-credentials с ключами
# s3-access-key-id / s3-secret-access-key.
#
# requireLocalDisk: true — Job требует ноду с локальным диском (лейбл
# karpenter.k8s.selectel/instance-local-disk): xet-режим пишет во временный
# каталог на диске, storageSize 200 (35 fileWorkers x ~5 ГБ).
# =============================================================================
s3ModelCopy:
  namespace: default
  model: zai-org/GLM-5.2
  s3Bucket: my-models-bucket # S3 bucket name
  requireLocalDisk: true
  storageSize: 200 # 35 (fileWorkers) * ~5GB (max size of single file) = 175GB storage
  parameters:
    transferClient: "crt"
    fileWorkers: 35
  env:
    # Selectel S3 settings
    - name: AWS_ENDPOINT_URL
      value: "https://s3.ru-1.storage.selcloud.ru"
    - name: AWS_DEFAULT_REGION
      value: "ru-1"
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: selectel-s3-credentials
          key: s3-access-key-id
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: selectel-s3-credentials
          key: s3-secret-access-key
