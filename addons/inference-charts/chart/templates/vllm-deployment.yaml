{{- if or (eq .Values.inference.framework "vllm") (eq .Values.inference.framework "aibrix") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.inference.serviceName}}
  namespace: {{.Values.inference.serviceNamespace}}
  labels:
    "app.kubernetes.io/component": "{{.Values.inference.serviceName}}"
    {{- if eq .Values.inference.framework "aibrix" }}
    model.aibrix.ai/name: "{{.Values.inference.serviceName}}"
    {{- end }}
    {{- include "inference-charts.extraLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.inference.modelServer.deployment.replicas }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      "app.kubernetes.io/component": "{{.Values.inference.serviceName}}"
      {{- if eq .Values.inference.framework "aibrix" }}
      model.aibrix.ai/name: "{{.Values.inference.serviceName}}"
      {{- end }}
  template:
    metadata:
      labels:
        "app.kubernetes.io/component": "{{.Values.inference.serviceName}}"
        {{- if eq .Values.inference.framework "aibrix" }}
        model.aibrix.ai/name: "{{.Values.inference.serviceName}}"
        {{- end }}
        {{- include "inference-charts.extraLabels" . | nindent 8 }}
    spec:
      containers:
        - name: main
          image: "{{ .Values.inference.modelServer.image.repository }}:{{ .Values.inference.modelServer.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - vllm serve {{ .Values.modelPath | default .Values.model }} {{ include "inference-charts.modelParameters" .  }}
          {{- if .Values.hfTokenSecret.envFrom }}
          {{- if .Values.hfTokenSecret.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.hfTokenSecret.name }}
          {{- end }}
          {{- end }}
          env:
          {{- range $key, $value := .Values.inference.modelServer.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
            {{- if and (not .Values.hfTokenSecret.envFrom) .Values.hfTokenSecret.enabled }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hfTokenSecret.name }}
                  key: {{ .Values.hfTokenSecret.key }}
            {{- end }}
          ports:
            - containerPort: 8000
              name: http
          resources:
            {{- include "inference-charts.acceleratorResources" . | nindent 12 }}
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            {{- toYaml .Values.inference.modelServer.deployment.startupProbe | nindent 12 }}
      {{- if .Values.inference.modelServer.deployment.instanceType }}
      nodeSelector:
        node.kubernetes.io/instance-type: {{ .Values.inference.modelServer.deployment.instanceType }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.inference.modelServer.deployment.topologySpreadConstraints.enabled .Values.inference.modelServer.deployment.topologySpreadConstraints.constraints }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              "app.kubernetes.io/component": "{{$.Values.inference.serviceName}}"
              {{- if eq .Values.inference.framework "aibrix" }}
              model.aibrix.ai/name: "{{.Values.inference.serviceName}}"
              {{- end }}
      {{- end }}
      {{- $gpuAffinity := or .Values.gpuNames .Values.gpuMinVramGb }}
      {{- $podAffinityEnabled := and .Values.inference.modelServer.deployment.podAffinity.enabled .Values.inference.modelServer.deployment.podAffinity.preferredDuringSchedulingIgnoredDuringExecution }}
      {{- if or $podAffinityEnabled $gpuAffinity }}
      affinity:
        {{- if $gpuAffinity }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
              {{- if .Values.gpuNames }}
                - key: gpu
                  operator: In
                  values:
                    {{- toYaml .Values.gpuNames | nindent 20 }}
              {{- end }}
              {{- if .Values.gpuMinVramGb }}
                - key: gpu-vram
                  operator: Gt
                  values:
                    - "{{ sub (int .Values.gpuMinVramGb) 1 }}"
              {{- end }}
        {{- end }}
        {{- if $podAffinityEnabled }}
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- range .Values.inference.modelServer.deployment.podAffinity.preferredDuringSchedulingIgnoredDuringExecution }}
            - weight: {{ .weight }}
              podAffinityTerm:
                topologyKey: {{ .podAffinityTerm.topologyKey }}
                labelSelector:
                  matchLabels:
                    "app.kubernetes.io/component": "{{$.Values.inference.serviceName}}"
                    {{- if eq $.Values.inference.framework "aibrix" }}
                    model.aibrix.ai/name: "{{$.Values.inference.serviceName}}"
                    {{- end }}
            {{- end }}
        {{- end }}
      {{- end }}
      volumes:
      {{- if .Values.inference.modelServer.deployment.sharedMemory }}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: {{ .Values.inference.modelServer.deployment.sharedMemory }}
      {{- end }}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccountName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{.Values.inference.serviceName}}
  namespace: {{.Values.inference.serviceNamespace}}
  labels:
    {{- include "inference-charts.extraLabels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: {{ .Values.service.portName | default "http" }}
  selector:
    "app.kubernetes.io/component": "{{.Values.inference.serviceName}}"
    {{- if eq .Values.inference.framework "aibrix" }}
    model.aibrix.ai/name: "{{.Values.inference.serviceName}}"
    {{- end }}
{{- end }}
