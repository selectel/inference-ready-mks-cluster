# NodePool: GPU RTX 6000 Ada 48 GB — 8–24B quant.
# Зоны (матрица доступности Selectel, регион ru-7): ru-7b.
# ВАЖНО (не проверено): значения instance-gpu-name — label без пробелов; точное
# написание знает только провайдер, поэтому перечислены варианты. Несовпавший
# вариант безвреден (просто не матчится). После первой поднятой ноды сверьте:
# kubectl describe node | grep instance-gpu-name — и оставьте совпавший вариант.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-rtx6000-ada
spec:
  # Приоритет при выборе пула (больше = предпочтительнее).
  # По умолчанию предпочитаем ДЕШЁВЫЙ GPU (меньше VRAM = выше вес):
  # под без селектора получает наименее дорогой подходящий пул.
  # Тяжёлые модели адресуются явным nodeSelector: {gpu: <имя>}.
  weight: 30
  template:
    metadata:
      labels:
        workload: inference
        gpu: rtx6000-ada
        # VRAM карты (ГБ) — для nodeAffinity (Gt) из inference-charts
        gpu-vram: "48"
    spec:
      nodeClassRef:
        name: default
        kind: SelectelNodeClass
        group: karpenter.k8s.selectel
      # expireAfter — поле template.spec (в spec.disruption его в karpenter.sh/v1 НЕТ).
      expireAfter: 720h
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ru-7b"]   # поправьте под свой сегмент
        - key: karpenter.k8s.selectel/instance-category
          operator: In
          values: ["GL"]
        - key: karpenter.k8s.selectel/instance-gpu-name
          operator: In
          values: ["RTX6000Ada", "RTX-6000-Ada", "RTX_6000_Ada"]   # не проверено (варианты написания) — см. ниже
        - key: karpenter.k8s.selectel/instance-gpu-count
          operator: Gt
          values: ["0"]
      # startupTaints для Cilium-кластеров (MKS по умолчанию — Calico):
      #   - key: node.cilium.io/agent-not-ready
      #     value: "true"
      #     effect: NoExecute
      #   - key: node.cilium.io/agent-not-ready
      #     effect: NoSchedule
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    # Для GPU-нод не спешим консолидировать: холодный старт = загрузка модели.
    consolidateAfter: 5m
  limits:
    # Лимит на ВСЕ ноды пула суммарно. Квота ускорителей по умолчанию — 32 на зону.
    cpu: "48"
    memory: 256Gi
