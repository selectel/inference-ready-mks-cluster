# NodePool: GPU H200 141 GB — 70B+ bf16, максимальный контекст.
# Зоны (матрица доступности Selectel, регион ru-6): ru-6a, ru-6b, ru-6c.
# ВАЖНО (не проверено): точное значение instance-gpu-name сверьте после первой
# поднятой ноды: kubectl describe node | grep instance-gpu-name — и поправьте values.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-h200
spec:
  # Приоритет при выборе пула (больше = предпочтительнее).
  # По умолчанию предпочитаем ДЕШЁВЫЙ GPU (меньше VRAM = выше вес):
  # под без селектора получает наименее дорогой подходящий пул.
  # Тяжёлые модели адресуются явным nodeSelector: {gpu: <имя>}.
  weight: 10
  template:
    metadata:
      labels:
        workload: inference
        gpu: h200
        # VRAM карты (ГБ) — для nodeAffinity (Gt) из inference-charts
        gpu-vram: "141"
    spec:
      nodeClassRef:
        name: default
        kind: SelectelNodeClass
        group: karpenter.k8s.selectel
      # expireAfter — поле template.spec (в spec.disruption его в karpenter.sh/v1 НЕТ).
      expireAfter: 720h
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ru-6a", "ru-6b", "ru-6c"]   # поправьте под свой сегмент
        - key: karpenter.k8s.selectel/instance-category
          operator: In
          values: ["GL"]
        - key: karpenter.k8s.selectel/instance-gpu-name
          operator: In
          values: ["H200"]   # не проверено — см. комментарий выше
        - key: karpenter.k8s.selectel/instance-gpu-count
          operator: Gt
          values: ["0"]
      # startupTaints для Cilium-кластеров (MKS по умолчанию — Calico):
      #   - key: node.cilium.io/agent-not-ready
      #     value: "true"
      #     effect: NoExecute
      #   - key: node.cilium.io/agent-not-ready
      #     effect: NoSchedule
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    # Для GPU-нод не спешим консолидировать: холодный старт = загрузка модели.
    consolidateAfter: 15m
  limits:
    # Лимит на ВСЕ ноды пула суммарно. Квота ускорителей по умолчанию — 32 на зону.
    cpu: "96"
    memory: 768Gi
