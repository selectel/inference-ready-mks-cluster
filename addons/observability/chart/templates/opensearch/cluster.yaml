{{- if and .Values.opensearch.enabled .Values.opensearch.cluster.enabled }}
apiVersion: opensearch.opster.io/v1
kind: OpenSearchCluster
metadata:
  name: opensearch
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: ai-ml-observability
spec:
  general:
    version: {{ .Values.opensearch.version | quote }}
    httpPort: 9200
    vendor: opensearch
    serviceName: {{ .Values.opensearch.serviceName }}
    setVMMaxMapCount: true
    drainDataNodes: true
    additionalConfig:
      cluster.default_number_of_replicas: {{ .Values.opensearch.defaultIndexReplicas | quote }}
  security:
    config:
      adminCredentialsSecret:
        name: opensearch-admin-credentials
      securityConfigSecret:
        name: opensearch-security-config
    tls:
      transport:
        generate: true
      http:
        generate: true
  dashboards:
    enable: {{ .Values.opensearch.dashboards.enabled }}
    version: {{ .Values.opensearch.version | quote }}
    replicas: {{ .Values.opensearch.dashboards.replicas }}
    opensearchCredentialsSecret:
      name: opensearch-admin-credentials
{{- if .Values.opensearch.oidc.enabled }}
    additionalConfig:
      # OIDC-вход через dex; basicauth оставляем (fluent-bit/Grafana и
      # локальный вход работают как раньше)
      opensearch_security.auth.type: '["basicauth", "openid"]'
      opensearch_security.auth.multiple_auth_enabled: "true"
      opensearch_security.openid.connect_url: {{ .Values.opensearch.oidc.connectUrl | quote }}
      opensearch_security.openid.client_id: {{ .Values.opensearch.oidc.clientId | quote }}
      opensearch_security.openid.client_secret: {{ .Values.opensearch.oidc.clientSecret | quote }}
      opensearch_security.openid.base_redirect_url: {{ .Values.opensearch.oidc.baseRedirectUrl | quote }}
      opensearch_security.openid.scope: "openid profile email"
      opensearch_security.openid.logout_url: {{ .Values.opensearch.oidc.baseRedirectUrl | quote }}
{{- end }}
    resources:
{{ toYaml .Values.opensearch.dashboards.resources | indent 6 }}
{{- with .Values.opensearch.dashboards.nodeSelector }}
    nodeSelector:
{{ toYaml . | indent 6 }}
{{- end }}
{{- with .Values.opensearch.dashboards.tolerations }}
    tolerations:
{{ toYaml . | indent 6 }}
{{- end }}
  confMgmt:
    smartScaler: false
  nodePools:
    - component: nodes
      replicas: {{ .Values.opensearch.replicas }}
      diskSize: {{ .Values.opensearch.storage.size | quote }}
      jvm: {{ .Values.opensearch.jvm | quote }}
      persistence:
        pvc:
{{- with .Values.opensearch.storage.className }}
          storageClass: {{ . | quote }}
{{- end }}
          accessModes:
            - ReadWriteOnce
      resources:
{{ toYaml .Values.opensearch.resources | indent 8 }}
{{- with .Values.opensearch.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.opensearch.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
      roles:
        - cluster_manager
        - data
        - ingest
{{- end }}
