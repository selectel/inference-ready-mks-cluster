{{- if .Values.opensearch.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-admin-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: ai-ml-observability
type: Opaque
data:
  username: {{ .Values.opensearch.credentials.adminUsername | b64enc | quote }}
  password: {{ include "ai-ml-observability.opensearchPassword" . | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-dashboard-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: ai-ml-observability
type: Opaque
data:
  username: {{ "dashboard_user" | b64enc | quote }}
  password: {{ include "ai-ml-observability.opensearchDashboardPassword" . | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-security-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: ai-ml-observability
type: Opaque
stringData:
  internal_users.yml: |-
    _meta:
      type: "internalusers"
      config_version: 2
    {{ .Values.opensearch.credentials.adminUsername }}:
      hash: {{ include "ai-ml-observability.opensearchPassword" . | bcrypt | quote }}
      reserved: true
      backend_roles:
        - "admin"
      description: "Observability smoke-test administrator"
    dashboard_user:
      hash: {{ include "ai-ml-observability.opensearchDashboardPassword" . | bcrypt | quote }}
      reserved: false
      backend_roles:
        - "readall"
      description: "Read-only Grafana OpenSearch user"
  roles_mapping.yml: |-
    _meta:
      type: "rolesmapping"
      config_version: 2
    all_access:
      reserved: false
      backend_roles:
        - "admin"
{{- if .Values.opensearch.oidc.enabled }}
      # OIDC-пользователь dex (preferred_username) — полный доступ
      users:
        - "admin"
{{- end }}
    readall:
      reserved: false
      backend_roles:
        - "readall"
    own_index:
      reserved: false
      users:
        - "*"
{{- if .Values.opensearch.oidc.enabled }}
  config.yml: |-
    _meta:
      type: "config"
      config_version: 2
    config:
      dynamic:
        http:
          anonymous_auth_enabled: false
        authc:
          # Порядок доменов: basic (fluent-bit, Grafana-датасорс, локальный
          # вход в дашборды) остаётся основным, openid — вторым.
          basic_internal:
            http_enabled: true
            transport_enabled: true
            order: 0
            http_authenticator:
              type: basic
              challenge: false
            authentication_backend:
              type: intern
          openid_dex:
            http_enabled: true
            transport_enabled: true
            order: 1
            http_authenticator:
              type: openid
              challenge: false
              config:
                # dex (staticPasswords) не отдаёт preferred_username в ID-токене;
                # name = username статического пользователя dex
                subject_key: name
                roles_key: groups
                openid_connect_url: {{ .Values.opensearch.oidc.connectUrl }}
                skip_users_allowed: false
            authentication_backend:
              type: noop
{{- end }}
{{- end }}
