{{- if .Values.rules.enabled }}
# Базовые алерты AI-нагрузок. Имена метрик проверены на живом кластере:
# vLLM (vllm:*, v0.11), DCGM (GPU Operator), LiteLLM, aibrix, CNPG.
# K8s-алерты (узел вниз, CrashLoop, PVC) идут из дефолтных правил
# kube-prometheus-stack.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-workloads
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: ai-ml-observability
spec:
  groups:
    - name: gpu
      rules:
        - alert: GpuXidError
          expr: DCGM_FI_DEV_XID_ERRORS > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "XID-ошибка на GPU {{ "{{" }} $labels.gpu {{ "}}" }} ({{ "{{" }} $labels.Hostname {{ "}}" }})"
            description: "Счётчик XID-ошибок NVIDIA растёт — проверить dmesg и состояние GPU."
        - alert: GpuHighTemperature
          expr: DCGM_FI_DEV_GPU_TEMP > 90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "GPU {{ "{{" }} $labels.gpu {{ "}}" }} перегрев ({{ "{{" }} $labels.Hostname {{ "}}" }})"
            description: "Температура выше 90°C 10 минут: охлаждение/троттлинг."
    - name: vllm
      rules:
        - alert: VllmQueueGrowing
          expr: vllm:num_requests_waiting > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Очередь запросов vLLM не рассасывается"
            description: "waiting > 5 в течение 10 минут — не хватает пропускной способности реплик."
        - alert: VllmKvCacheNearFull
          expr: vllm:kv_cache_usage_perc > 0.95
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "KV-кэш vLLM почти заполнен"
            description: "Ре-программные прерывания/preemption: увеличить gpu_memory_utilization или реплики."
        - alert: VllmPreemptions
          expr: increase(vllm:num_preemptions_total[5m]) > 0
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "vLLM прерывает запросы (preemption)"
            description: "Не хватает KV-кэша под конкурентные запросы."
    - name: gateway-litellm
      rules:
        - alert: LiteLLMFailures
          expr: increase(litellm_proxy_failed_requests_metric_total[10m]) > 3
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "LiteLLM: ошибки прокси-запросов"
            description: "Более 3 неуспешных запросов за 10 минут ({{ "{{" }}$value{{ "}}" }})."
        - alert: AibrixGatewayErrors
          expr: sum by (target_model_name) (increase(gateway_request_model_fail_total[10m])) > 3
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "AIBrix: ошибки шлюза по модели {{ "{{" }} $labels.target_model_name {{ "}}" }}"
            description: "Более 3 неуспешных запросов за 10 минут."
    - name: postgres-cnpg
      rules:
        - alert: CnpgReplicationLag
          expr: cnpg_pg_replication_lag > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Реплика CNPG {{ "{{" }} $labels.cluster {{ "}}" }} отстаёт"
            description: "Лаг репликации {{ "{{" }}$value{{ "}}" }}с дольше 5 минут."
        - alert: CnpgCollectorDown
          expr: cnpg_collector_up == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Экспортер метрик CNPG недоступен ({{ "{{" }} $labels.pod {{ "}}" }})"
{{- end }}
