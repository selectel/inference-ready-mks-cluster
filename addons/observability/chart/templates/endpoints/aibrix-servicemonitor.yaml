{{- if and .Values.endpoints.enabled .Values.endpoints.aibrix.enabled }}
# Метрики aibrix gateway-plugin (:8080 /metrics): запросы по моделям,
# токены, латентность шлюза.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aibrix-gateway-plugins
  namespace: {{ .Values.endpoints.aibrix.namespace }}
  labels:
    app.kubernetes.io/part-of: ai-ml-observability
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.endpoints.aibrix.namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: aibrix
      app.kubernetes.io/component: aibrix-gateway-plugin
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
{{- end }}
