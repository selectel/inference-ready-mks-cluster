{{- if and .Values.endpoints.enabled .Values.endpoints.dcgm.enabled }}
# DCGM с GPU-нод. Экспортер ставит GPU Operator (daemonset
# nvidia-dcgm-exporter, ns gpu-operator) — отдельный сабчарт dcgm в этом
# чарте не нужен, только ServiceMonitor.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvidia-dcgm-exporter
  namespace: {{ .Values.endpoints.dcgm.namespace }}
  labels:
    app.kubernetes.io/part-of: ai-ml-observability
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.endpoints.dcgm.namespace }}
  selector:
    matchLabels:
      app: nvidia-dcgm-exporter
  endpoints:
    - port: gpu-metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 25s
{{- end }}
