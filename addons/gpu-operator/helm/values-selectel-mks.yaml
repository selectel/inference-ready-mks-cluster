# =============================================================================
# GPU Operator (NVIDIA) для Selectel MKS — classic-режим (device plugin).
# Ставит на GPU-нодах: драйвер NVIDIA, container-toolkit, device plugin
# (nvidia.com/gpu), DCGM-exporter. Аллокация GPU — стандартная, через
# nvidia.com/gpu; Karpenter провижинит ноды под такие поды нативно.
# =============================================================================
# Порядок values: сначала дефолты чарта (values.yaml), потом этот файл —
# побеждает последний.
#
# ВАЖНО (инвариант): GPU-ноды должны создаваться БЕЗ предустановленного
# MKS-стека — в SelectelNodeClass выставить installNvidiaDevicePlugin: false
# (addons/karpenter/selectelnodeclass.yaml), чтобы не было двух device plugin'ов.
#
# DRA (experimental): НЕ включать здесь (gpuCluster.deployCR) — чарт запрещает
# ClusterPolicy и GPUCluster одновременно. DRA-драйвер ставится отдельным чартом
# (addons/dra-test/) рядом с device plugin — см. README dra-test.
# =============================================================================
gpuCluster:
  # GPUCluster CR (DRA-стек) НЕ ставим: взаимоисключим с ClusterPolicy
  # (валидация чарта), а DRA на production-пути не используется (Karpenter
  # без DynamicResources не провижинит ноды под DRA-поды).
  deployCR: false

clusterPolicy:
  # Classic-стек: драйвер + toolkit + device plugin + DCGM-exporter.
  deployCR: true

driver:
  # Драйвер через NVIDIADriver CR: ClusterPolicy ссылается на него
  # (spec.driver.useNvidiaDriverCRD), образ/версия — из значений ниже.
  nvidiaDriverCRD:
    enabled: true
  # Версия драйвера для установки на ноды (компилируется под ядро, ~2 мин).
  version: "595.91.07"
  # Установка тянет пакеты из archive.ubuntu.com — на свежих нодах
  # медленный апстрим (apt-каталоги ~15+ мин): дефолтных ~21 мин пробы не
  # хватает, контейнер рестартует в середине установки и начинает заново
  # (проверено на H200 2026-09-11). 600×10с ≈ 100 мин.
  startupProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 60
    failureThreshold: 600

devicePlugin:
  # Аллокация GPU через nvidia.com/gpu (device plugin) — production-путь.
  enabled: true

cdi:
  enabled: true
  # КРИТИЧНО для MKS: без NRI-режима toolkit пишет drop-in в /etc/containerd и
  # шлёт containerd SIGHUP — на MKS-нодах (containerd 2.3.3) containerd после
  # этого не восстанавливается и нода умирает (kubelet перестаёт отвечать).
  # Проверено дважды, детерминированно, 2026-09-10. В NPI-режиме — noop-
  # конфигуратор: конфиг containerd не читается и не изменяется вовсе,
  # рестарта нет; инжекция устройств — через NRI-плагин (containerd 2.x — NRI
  # включён по умолчанию).
  nriPluginEnabled: true

operator:
  # Версии пиннуты (чарт собран из GitHub-тега — appVersion в нём main-latest).
  version: v26.7.0
validator:
  version: v26.7.0
