# =============================================================================
# DRA-драйвер (kubernetes-sigs/dra-driver-nvidia-gpu v0.5.0) — ТЕСТОВЫЙ аддон.
# Ставится РЯДОМ с device plugin из gpu-operator (ClusterPolicy): с одной
# стороны — classic-аллокация nvidia.com/gpu, с другой — DRA ResourceClaims.
#
# ⚠ ОСОЗНАННЫЙ РИСК (googleOverride ниже): NVIDIA запрещает совместную работу
# device plugin и DRA-драйвера на одной ноде (валидация чарта), пока KEP 5004
# (DRAExtendedResource) не станет GA: обе системы аллокации НЕ знают друг о
# друге — ОДНА И ТА ЖЕ физическая карта может быть выдана и classic-поду, и
# DRA-claim'у (двойная аллокация → OOM). Держите ручной учёт занятости
# (kubectl describe node, kubectl get resourceclaims, nvidia-smi на ноде).
# На MKS включить KEP 5004 нельзя (feature gates control-plane не подконтрольны).
# =============================================================================
resources:
  gpus:
    enabled: true
  computeDomains:
    # Multi-Node NVLink — не используем (нет MNNVL-железа).
    enabled: false

# Драйвер на нодах ставит gpu-operator через NVIDIADriver CR — он живёт в
# /run/nvidia/driver (hostPaths.driverInstallDir). Дефолт «/» предполагает
# драйвер прямо в хост-ОС — у нас так: без этого init-контейнер зависает
# в ожидании nvidia-smi/libnvidia-ml (проверено 2026-09-10).
nvidiaDriverRoot: /run/nvidia/driver

gpuResourcesEnabledOverride: true
# ^ override валидации чарта: «driver cannot be deployed alongside the
# standard GPU device plugin on the same node». Мы ставим device plugin
# через gpu-operator (ClusterPolicy) и ПРИНИМАЕМ риск двойной аллокации —
# только для тестового сценария DRA.

featureGates:
  # Шаринг GPU по памяти (consumable capacity, k8s >=1.34, в 1.36 beta):
  # карта делится между ResourceClaim'ами по capacity.requests.memory.
  ConsumableShares: true

kubeletPlugin:
  containers:
    gpus:
      env:
        # Режим memory: устройство получает requestPolicy {min 1Mi, max VRAM,
        # step 1Mi}; claim без явного capacity занимает ВСЮ карту (default),
        # с явным (например memory: 20Gi) — только запрошенный кусок.
        - name: CONSUMABLE_SHARES
          value: memory
