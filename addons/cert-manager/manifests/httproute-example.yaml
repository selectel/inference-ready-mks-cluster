# ПРИМЕР: как добавить новый сервис на edge-шлюз (rendered/gateway-edge.yaml).
# Не рендерится terraform'ом — скопируйте, подставьте имя хоста/сервис и:
#   kubectl apply -f my-service-route.yaml
# A-запись создаст external-dns автоматически (source gateway-httproute),
# wildcard-сертификат *.<домен> уже покрывает любое имя третьего уровня.
# Условия: сервис должен быть в кластере, external-dns и edge-gw — установлены.
#
# Пример: openwebui (неймспейс openwebui, сервис openwebui, порт 8080)
# на хосте chat.example.com.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openwebui
  namespace: openwebui # namespace сервиса
spec:
  parentRefs:
    - name: edge-gw
      namespace: litellm # ← edge-gw живёт в ns litellm: без этого поля ищется в ns маршрута
      sectionName: https
  hostnames:
    - chat.example.com # ← ваше имя *.example.com
  rules:
    - backendRefs:
        - name: openwebui # ← имя сервиса
          port: 8080 # ← порт сервиса
