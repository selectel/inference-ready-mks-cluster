apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-route
  namespace: vllm-inference
spec:
  parentRefs:
    - name: vllm-gateway
      namespace: vllm-inference
  hostnames:
    - "vllm.local"
  rules:
    - backendRefs:
        - name: vllm-service
          port: 8000
